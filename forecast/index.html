<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>400 进线量与人力预测</title>
<style>
  :root{
    --bg:#0f172a; --card:#16213a; --card2:#1c2942; --line:#253352;
    --txt:#e2e8f0; --dim:#94a3b8; --accent:#93c5fd;
    --need:#60a5fa; --on:#64748b; --good:#4ade80; --warn:#fbbf24; --bad:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       padding:20px 22px 40px}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:19px;margin:0;font-weight:600}
  .sub{color:var(--dim);font-size:12px;margin:2px 0 16px}
  .sub b{color:var(--accent);font-weight:600}
  .back{font-size:12px;color:var(--dim);margin-left:auto}

  .ctrl{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:14px 16px;display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
  .ctrl label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--dim)}
  .ctrl input{background:var(--card2);border:1px solid var(--line);border-radius:7px;
              color:var(--txt);padding:8px 10px;font-size:14px;font-family:inherit;outline:none}
  .ctrl input:focus{border-color:var(--accent)}
  .ctrl input[type=number]{width:150px}
  .ctrl button{background:var(--accent);color:#0b1220;border:0;border-radius:7px;
               padding:9px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  .ctrl button:hover{filter:brightness(1.08)}
  .ctrl .hint{font-size:12px;color:var(--dim);align-self:center}
  .ctrl .hint b{color:var(--accent)}

  h2{font-size:13px;color:var(--dim);font-weight:600;margin:24px 0 10px;
     letter-spacing:.04em;text-transform:uppercase}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;position:relative;overflow:hidden}
  .kpi::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--accent);opacity:.85}
  .kpi .k{font-size:11px;color:var(--dim);margin-bottom:3px}
  .kpi .v{font-size:20px;font-weight:600;line-height:1.2}
  .kpi .u{font-size:11px;color:var(--dim);margin-left:3px;font-weight:400}
  .kpi.good::before{background:var(--good)} .kpi.good .v{color:var(--good)}
  .kpi.bad::before{background:var(--bad)}   .kpi.bad .v{color:var(--bad)}
  .kpi.warn::before{background:var(--warn)} .kpi.warn .v{color:var(--warn)}
  /* 「实际」卡：顶条用折线图的实际线同色（黄），数值不变色 */
  .kpi.act::before{background:var(--warn)}
  .kpi .kn{font-size:11px;color:var(--dim);margin-top:2px}
  /* KPI 分组小标题（跨整行，右侧带分隔线） */
  .kpi-sep{grid-column:1/-1;display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--dim);letter-spacing:.03em;margin:3px 0 -3px}
  .kpi-sep::after{content:'';flex:1;height:1px;background:var(--line)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}

  /* ── 现场调控：预警卡 ── */
  .sc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .sc-obj{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:11px 13px}
  .sc-obj .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .sc-obj .nm{font-weight:600;font-size:14px}
  .lv{font-size:11px;font-weight:600;border-radius:20px;padding:2px 9px;border:1px solid;white-space:nowrap}
  .lv-0{color:var(--good);border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.10)}
  .lv-1{color:var(--accent);border-color:rgba(147,197,253,.35);background:rgba(147,197,253,.10)}
  .lv-2{color:var(--warn);border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.10)}
  .lv-3{color:#fb923c;border-color:rgba(251,146,60,.35);background:rgba(251,146,60,.10)}
  .lv-4{color:var(--bad);border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.10)}
  .sc-row{display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--dim);
          padding:4px 0;border-top:1px dashed var(--line)}
  .sc-row .k{flex:0 0 30px;color:var(--dim)}
  .sc-row b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
  .sc-row .u2{font-size:11px;opacity:.7}
  .sc-acts{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.72}
  .sc-acts .ah{font-size:11px;color:var(--dim);letter-spacing:.04em;margin-bottom:3px}
  .sc-acts .ah .own{margin-left:8px;padding-left:8px;border-left:1px solid var(--line);letter-spacing:0}
  .sc-acts ol{margin:0;padding-left:18px;color:var(--txt)}
  .sc-acts li{margin:1px 0}
  .sc-acts .none{color:var(--dim);font-size:12px}

  /* ── 现场调控：按时段建议 ── */
  .tl{font-size:13.5px}
  .tl-row{display:grid;grid-template-columns:104px 218px 1fr;gap:10px;align-items:baseline;
          padding:6px 0;border-top:1px solid var(--line)}
  .tl-row:first-child{border-top:0}
  .tl-t{color:var(--txt);font-variant-numeric:tabular-nums;font-weight:600;font-size:12.5px}
  .tl-n{color:var(--dim);font-variant-numeric:tabular-nums;font-size:12.5px}
  .tl-a{color:var(--txt)}
  .tl-a.bad{color:var(--bad);font-weight:600}
  .tl-a.good{color:var(--good)}
  .tl-note{font-size:11.5px;color:var(--dim);margin-left:6px}
  .tl-head{font-size:11px;color:var(--dim);letter-spacing:.04em;margin:10px 0 2px}

  /* ── 用餐安排 ── */
  .meal-grp{margin-bottom:14px}
  .meal-grp:last-child{margin-bottom:0}
  .meal-hd{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;font-size:13px;font-weight:600;margin-bottom:6px}
  .meal-hd .sub{font-weight:400;font-size:11.5px;color:var(--dim)}
  .meal-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .meal-win{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  .meal-win .wt{font-size:12px;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
  .meal-win .wt .r{font-weight:400;color:var(--dim);font-size:11px}
  .meal-row{display:grid;grid-template-columns:88px 34px 1fr;gap:8px;align-items:baseline;
    padding:3px 0;border-top:1px dashed var(--line);font-size:12px}
  .meal-row:first-of-type{border-top:0}
  .meal-row .t{color:var(--dim);font-variant-numeric:tabular-nums}
  .meal-row .n{color:var(--accent);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  .meal-row .p{color:var(--txt)}
  .meal-row .p em{color:var(--dim);font-style:normal;font-size:11px}
  @media(max-width:820px){.meal-wrap{grid-template-columns:1fr}}

  .advice{font-size:14px;line-height:1.75}
  .advice .t{font-weight:600;margin-bottom:2px}
  .advice .d{color:var(--dim)}
  .advice .ln{margin-top:6px}
  @media(max-width:820px){.sc{grid-template-columns:1fr}.tl-row{grid-template-columns:96px 1fr;gap:4px 10px}.tl-a{grid-column:1/3}}

  .legend{display:flex;gap:16px;font-size:12px;color:var(--dim);margin:2px 0 8px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .di-note{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.65}
  .di-note b{color:var(--accent);font-weight:600}
  .gtsw{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .gtsw button{background:var(--card2);border:1px solid var(--line);color:var(--dim);
               border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer;font-family:inherit}
  .gtsw button:hover{border-color:var(--accent)}
  .gtsw button.on{background:var(--accent);color:#0b1220;border-color:var(--accent);font-weight:600}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--dim);font-weight:500;font-size:11px;text-align:right;position:sticky;top:0;background:var(--card)}
  th:first-child,td:first-child{text-align:left}
  tbody tr:hover{background:var(--card2)}
  td.gap-bad{color:var(--bad);font-weight:600}
  td.gap-good{color:var(--good)}
  td.load-hot{color:var(--warn);font-weight:600}
  .tblwrap{max-height:340px;overflow:auto;border-radius:8px}
  details summary{cursor:pointer;color:var(--dim);font-size:12px;padding:6px 0;outline:none}
  details[open] summary{margin-bottom:6px}
  .doc{font-size:12.5px;line-height:1.75;color:var(--dim)}
  .doc-sec{margin:0 0 11px}
  .doc-sec:last-child{margin-bottom:0}
  .doc-sec h4{margin:0 0 4px;font-size:12.5px;color:var(--accent);font-weight:600}
  .doc-sec ul{margin:0;padding-left:17px}
  .doc-sec li{margin:2px 0}
  .doc-sec b{color:var(--txt);font-weight:600}
  .doc-sec code{color:var(--txt);background:rgba(148,163,184,.14);padding:0 4px;border-radius:4px}
  footer{margin-top:26px;color:var(--dim);font-size:12px;line-height:1.8;border-top:1px solid var(--line);padding-top:14px}
  footer b{color:var(--accent);font-weight:600}
  .err{color:var(--bad);font-size:13px}
  svg{display:block;width:100%;height:auto;overflow:visible}

  /* 排班计划板块 */
  .planhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
            font-size:12px;color:var(--dim);line-height:1.75;margin-bottom:10px}
  .planhead .txt{flex:1;min-width:280px}
  .planhead b{color:var(--accent)}
  .planhead select{background:var(--card2);border:1px solid var(--line);color:var(--txt);
                   border-radius:6px;padding:5px 8px;font-size:12px;font-family:inherit;outline:none}
  .planhead select:focus{border-color:var(--accent)}
  #planTbl tbody tr{cursor:pointer}
  #planTbl tbody tr.sel{background:rgba(147,197,253,.13);box-shadow:inset 3px 0 0 var(--accent)}
  #planTbl tbody tr.sel td:first-child{color:var(--accent);font-weight:600}
  td.wk{color:var(--warn)}
  .tip{position:fixed;pointer-events:none;background:#0b1220;border:1px solid var(--line);
       border-radius:6px;padding:7px 10px;font-size:12px;line-height:1.6;opacity:0;
       transition:opacity .12s;z-index:99;white-space:nowrap}
</style>
</head>
<body>

<header>
  <h1>📞 400 进线量与人力预测</h1>
  <span class="back"><a href="../">← 返回实时看板</a></span>
</header>
<div class="sub" id="modelSub">加载模型系数…</div>

<section class="ctrl">
  <label>目标日期<input type="date" id="dDate"></label>
  <label>预估订单量<input type="number" id="dOrders" min="0" step="1000" placeholder="填订单量"></label>
  <button id="btnGo">计算</button>
  <span class="hint" id="hint"></span>
</section>

<h2>当日总览</h2>
<div class="kpis" id="kpis"></div>

<h2>每日时段预测</h2>
<div class="panel">
  <div class="legend">
    <span><i style="background:#60a5fa;width:14px;height:3px;border-radius:2px"></i>预测转人工量</span>
    <span><i style="background:#fbbf24;width:14px;height:3px;border-radius:2px"></i>实际转人工量</span>
  </div>
  <div id="chart"></div>
  <div class="di-note" id="chartNote"></div>
</div>

<h2>现场调控 · 预警与建议</h2>
<div class="panel">
  <div class="sc" id="scWarn"></div>
  <div class="di-note" id="scNote" style="margin-top:10px"></div>
  <div class="tl-head">按时段人力调控建议（从早到晚）</div>
  <div class="tl" id="advice"></div>
  <div class="di-note" id="adviceNote"></div>
</div>

<h2 id="mealSec">🍚 用餐安排 · 在线 / 400</h2>
<div class="panel">
  <div class="di-note" style="margin-bottom:8px" id="mealNote"></div>
  <div id="meal"></div>
</div>

<h2>时段明细</h2>
<div class="panel">
  <div class="gtsw">
    <button data-g="hour" class="on" id="gHour">按小时</button>
    <button data-g="half" id="gHalf">按半小时</button>
    <span style="align-self:center;color:var(--dim);font-size:12px" id="grainNote"></span>
  </div>
  <div class="tblwrap"><table id="tbl"></table></div>
  <div class="di-note" id="tblNote"></div>
</div>

<h2>未来排班计划 · 每日进线量与所需人力</h2>
<div class="panel">
  <div class="planhead">
    <span class="txt" id="planSub">加载计划表…</span>
    <span class="txt" style="display:flex;align-items:center;gap:6px;color:var(--dim);flex:0 0 auto;white-space:nowrap">产能基准
      <b style="color:var(--accent)" id="capVal">—</b>
      <span style="opacity:.65" id="capNote">（按接通率目标标定）</span></span>
    <label style="display:flex;align-items:center;gap:6px">当班口径
      <select id="stfSel">
        <option value="schedule">HR 班表</option>
        <option value="sheet">运营分时段表</option>
      </select></label>
  </div>
  <div class="tblwrap" style="max-height:430px"><table id="planTbl"></table></div>
</div>

<h2 id="docSec">📖 报表说明 · 口径与算法</h2>
<div class="panel"><div class="doc" id="doc"></div></div>

<footer id="foot"></footer>
<div class="tip" id="tip"></div>

<script>
const WD = ['周一','周二','周三','周四','周五','周六','周日'];
const $ = id => document.getElementById(id);
const fmt = (n, d=0) => (n===null||n===undefined||isNaN(n)) ? '-' : Number(n).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
const bust = u => u + (u.includes('?') ? '&' : '?') + '_t=' + Date.now();

let C = null;
let RES = null;
let CARGO = null;   // 货量预测（《风控人效预测看板》），用于自动带出订单量
let PLAN = null;    // 排班计划表（build_plan.py → plan.json），日/小时维度 + 两套当班口径
const SHEET_CAP = 13;         // 表内常数（飞书分时段表「排班运能负荷」分母同源）—— 仅作参照，**不作为需求人力口径**
// 🎯 产能基准 = 为达成「目标人工接通率」标定出的通/人/时（用户 2026-09-14 给目标 85%）：
//    人工接通率 = 接通量 ÷ 转人工量（剔除 IVR 自助分流）；历史实测 85% ↔ 运能负荷 ≈ 0.92 ↔ 人效 ≈ 12.0 通/人/时。
//    标定链：forecast/calibrate_rate.py → rate_target.json → export_coeffs.py → coeffs.json（本页读它）。
//    ⚠️ 表内常数 13 对应负荷 1.00，实测接通率只有 ~82%，偏乐观，故不用。
const CAP_FALLBACK = 12.0;
let RATE_TGT = 0.85;          // 目标人工接通率（coeffs.json 的 rate_target 覆盖）
let CAP = CAP_FALLBACK;       // 现用产能基准（coeffs.json 的 cap_per_hour 覆盖）
let CAP_FIXED = CAP_FALLBACK; // 兼容旧引用：= 生效的产能基准
let PLAN_MODE = 'schedule';   // 当班人力口径：schedule=HR班表 / sheet=运营分时段表
let GRAIN = 'hour';           // 时段明细粒度：hour / half
let HH_LIVE = null;   // 当日实时半小时（../call_halfhour.json）：{ date, slots[] } —— 时段量级 📞400 同源
let HH_ACT  = null;   // 半小时实际转人工归档（hh_actual.json）：days[date]['09:00-09:30'] = 转人工量
let HH_RATE = null;   // 近 7 日同时段平均接通率（hh_rate.json）：slots['09:00-09:30'] = 0.8798（表内口径 = 接通量÷转人工量）
let ALERT   = null;   // 现场调控预警（../alert_state.json，alert_eval.js 每轮判定）：objects.{c400d,c400w,onld,onlw}
let SCHED   = null;   // 飞书 HR 班表（../schedule.json）：daily[date].onDuty 当班名单 + agents[].dept —— 用餐名单来源（在线）
let MEAL    = null;   // 当前选中日期的用餐分配（mealPlanFor()）

// ── 预警档位与预案 ──
// 档位阈值与 alert_eval.js 完全一致（用户 2026-09-09 定义 / 09-10 修正）；
// 预案动作 = 用户 2026-09-14 提供的《400/在线现场调控预案》**原文**（逐字录入，勿改写）。
// 触发条件（两维度同构）：运能负荷 + 接通率**同时**落入同档才命中，取较严档。
const LV_NAME = ['低负荷', '正常', '一级', '二级', '三级'];
const PLAN_ACT = {
  d: {   // 日维度（实时动作）
    0: ['支援工单/客诉', '还餐', '放休'],
    1: ['正常排班'],
    2: ['组长介入催促人效达成', '在线&400 业务互相支援', '工单/客诉支援一线',
        '共性批量问题，组长安排专人进行处理，有结果后短信回复用户，无需让用户在线等结果'],
    3: ['400 安排顺延 1h：20-21', '安排客诉顺延 1-3h 支援一线', '安排休班人员临时补班',
        '质培团队暂停监控，支援业务团队'],
    4: ['全员上班，包含组长主管', '对接运营，排查共性问题启动应急预案'],
  },
  w: {   // 周维度（T-1 动作）
    0: ['支援工单/客诉', '放休'],
    1: ['正常排班'],
    2: ['对接运营，排查共性问题启动应急预案', '摸排出勤，安排休班员工补班超负荷时段'],
    3: ['二休二调整为做三休一', '质培团队暂停监控，支援业务团队'],
    4: ['全员上班，包含组长主管'],
  },
};
// 预案责任人（取自原表单「责任人」列）：低负荷~二级＝客服组长，三级＝业务负责人
const PLAN_OWNER = { 0: '客服组长', 1: '客服组长', 2: '客服组长', 3: '客服组长', 4: '业务负责人' };

// '2026-09-14 09:00:00' / '09:00:00' / '09:00' → '09:00-09:30'
// ⚠️ 三种时间写法都要兼容：实时采集是完整时间戳，飞书归档与 coeffs.shape.slots 是「时段」标签
function slotLabel(t) {
  let s = String(t || '').trim();
  const sp = s.indexOf(' ');
  if (sp >= 0) s = s.slice(sp + 1);                 // 去掉 'YYYY-MM-DD ' 前缀
  const m = s.match(/^(\d{1,2}):(\d{2})/);
  if (!m) return null;
  const h = +m[1], mi = +m[2];
  const a = String(h).padStart(2, '0') + ':' + String(mi).padStart(2, '0');
  const b = (mi === 0 ? String(h).padStart(2, '0') + ':30'
                      : String(h + 1).padStart(2, '0') + ':00');
  return a + '-' + b;
}

// 某日「实际转人工量」映射：{ '09:00-09:30': 72, ... }；无数据返回 null
//   当日优先取实时采集（比归档新，且当天值随时间递增）；其余日期取归档
function actualTurnMap(dateStr) {
  if (HH_LIVE && HH_LIVE.date === dateStr && Array.isArray(HH_LIVE.slots)) {
    const m = {};
    HH_LIVE.slots.forEach(s => {
      const k = slotLabel(s.t);
      if (k) m[k] = (Number(s.total) || 0) - (Number(s.ivr) || 0);   // 转人工量 = 呼入总数 − IVR 自助接起
    });
    if (Object.keys(m).length) return m;
  }
  const d = HH_ACT && HH_ACT.days && HH_ACT.days[dateStr];
  return (d && typeof d === 'object') ? d : null;
}

// 某日「实际」汇总（供 KPI 卡）：{ inbound, turn, partial, first, last }
//   当日 = 实时采集 call_halfhour.json（含进线量 total 与 IVR）→ inbound 可用，partial=true（当天未完）
//   历史 = hh_actual.json（只有转人工量）→ inbound = null
//   ⚠️ first/last = 实际数据覆盖的**首/末时段起始时刻**，预测截断要按这个窗口对齐（报表窗口常为 09:00 起）
function actualLiveSum(dateStr) {
  if (HH_LIVE && HH_LIVE.date === dateStr && Array.isArray(HH_LIVE.slots) && HH_LIVE.slots.length) {
    let inbound = 0, turn = 0;
    HH_LIVE.slots.forEach(s => {
      const t = Number(s.total) || 0;
      inbound += t;
      turn += t - (Number(s.ivr) || 0);
    });
    const f = HH_LIVE.slots[0], l = HH_LIVE.slots[HH_LIVE.slots.length - 1];
    return { inbound, turn, partial: true,
             first: (slotLabel(f.t) || '').slice(0, 5),
             last:  (slotLabel(l.t) || '').slice(0, 5) };
  }
  const d = HH_ACT && HH_ACT.days && HH_ACT.days[dateStr];
  if (d && typeof d === 'object') {
    let turn = 0;
    for (const v of Object.values(d)) turn += Number(v) || 0;
    return { inbound: null, turn, partial: false, first: '', last: '' };
  }
  return null;
}

// 预测累计到「与实际**同一窗口**」：只累加起始时刻落在 [fromLabel, toLabel] 内的半小时段。
//   ⚠️ 用户 2026-09-14 口径：当日总览的预测量必须与实际采集同窗口，否则看不出高/低估。
//   ⚠️ 必须同时卡两端：报表窗口常见 09:00 起（08:00–09:00 无实际），只卡右端会多算早盘造成「假高估」。
//      全天预测量另设一组卡单独展示（整体口径）。
function predictTo(res, fromLabel, toLabel) {
  if (!toLabel) return null;
  let inbound = 0, turn = 0, n = 0;
  res.slots.forEach(s => {
    const k = String(s.t).slice(0, 5);          // 'HH:MM'（零填充，可直接字符串比较）
    if (fromLabel && k < fromLabel) return;
    if (k > toLabel) return;
    inbound += s.inbound; turn += s.turn; n++;
  });
  return n ? { inbound, turn, n } : null;
}

// ─────────────────────────────────────────────────────────────
// 用餐安排
//   · 在线 / 400 每位员工每天用餐 2 次，每次 30 分钟
//   · 第一餐窗口 10:30–14:00，第二餐窗口 17:00–20:00（用户 2026-09-14 定；第一餐原 11:00–15:00）
//   · 生理需求：第一餐吃得早的，第二餐也应该早
//   · 🔴 用户 2026-09-14 追加：「出勤人多但**没有实时储备人力**，临时抽调支援很难 ——
//        所以餐点安排要尽量按**对接通率影响最小**来排」
//         → 分配不再是「均匀均摊」，而是**按各时段空闲度错峰**：
//           权重 = 0.4 + max(0, 当班 − 需求)（该槽的冗余人力），冗余大的时段多排、紧张的时段少排；
//           单槽封顶 = ceil(N/L × 1.6)，避免错峰把人全堆到某一个时段反而制造新的缺口。
//         ⚠️ 权重取自**不含用餐**的基础盘（predict 第一遍），先有基础负荷、再排餐、再扣餐。
//   · 「早→早」仍成立：人数定好后，按名单顺序**沿时间顺序**落位 → 人名序号越大，
//     两餐所在时段都越晚（单调不减），所以第一餐早的人第二餐同样早。
// ─────────────────────────────────────────────────────────────
const MEAL_WINS = [
  { key: 'A', name: '第一餐', from: 10 * 60 + 30, to: 14 * 60 },
  { key: 'B', name: '第二餐', from: 17 * 60, to: 20 * 60 },
];
const MEAL_SLACK_FLOOR = 0.4;   // 无冗余时段的权重下限（仍可能被排到，只是最少）
const MEAL_CAP_RATIO  = 1.6;    // 单槽离岗人数上限 = 均匀份额 × 此系数
let BASE_SLOTS = null;          // 不含用餐的基础盘（predict 第一遍产物），供用餐错峰取权重
const MEAL_MIN = 30;                                       // 每餐时长（分钟）
const MEAL_DEPTS = ['400', '在线'];

function hm(min) { return String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0'); }
// 窗口内的半小时槽（起始升序）：10:30–14:00 → 7 段；17:00–20:00 → 6 段
function mealSlots(win) {
  const out = [];
  for (let m = win.from; m + MEAL_MIN <= win.to; m += MEAL_MIN) out.push(hm(m) + '-' + hm(m + MEAL_MIN));
  return out;
}
// 各槽「空闲度」权重：0.4 + max(0, 当班 − 需求)。取不到基础盘时退化为均匀（全 1）。
function mealSlotWeights(slotLabels) {
  return slotLabels.map(lb => {
    if (!BASE_SLOTS) return 1;
    const s = BASE_SLOTS.find(x => x.t === lb);
    if (!s) return 1;
    return MEAL_SLACK_FLOOR + Math.max(0, (s.onI || 0) - (s.needI || 0));
  });
}
// 按权重定各槽离岗人数 → 再按名单顺序沿时间落位。
//   ① 人数：按权重比例分摊（越空闲越多），单槽封顶 cap，余数按权重从大到小补；
//   ② 落位：沿【时间顺序】依次填 → 人名序号越大时段越晚（两餐都单调）＝「早→早」。
function mealAllocate(names, slotLabels, weights) {
  const map = {};
  slotLabels.forEach(s => { map[s] = []; });
  const L = slotLabels.length, N = names.length;
  if (!L || !N) return map;
  const w = slotLabels.map((s, i) => {
    const x = weights ? weights[i] : 1;
    return (x && x > 0) ? x : 0.01;
  });
  const cap = Math.max(1, Math.ceil(N / L * MEAL_CAP_RATIO));
  const cnt = new Array(L).fill(0);
  let rem = N;
  for (let round = 0; round < 12 && rem > 0; round++) {
    const free = cnt.map((c, i) => (c < cap ? w[i] : 0));
    const sw = free.reduce((a, b) => a + b, 0);
    if (!sw) break;
    let placed = 0;
    for (let i = 0; i < L; i++) {
      if (!free[i]) continue;
      const add = Math.min(cap - cnt[i], Math.floor(rem * free[i] / sw));
      if (add > 0) { cnt[i] += add; placed += add; }
    }
    if (!placed) break;
    rem -= placed;
  }
  w.map((x, i) => [x, i]).sort((a, b) => b[0] - a[0])
    .forEach(p => { while (rem > 0 && cnt[p[1]] < cap) { cnt[p[1]]++; rem--; } });
  if (rem > 0) for (let i = 0; i < L && rem > 0; i++) { cnt[i] += rem; rem = 0; }
  let p = 0;
  slotLabels.forEach((s, k) => { for (let j = 0; j < cnt[k]; j++) map[s].push(names[p++]); });
  return map;
}
// 某日某条线的当班名单：
//   400  ← plan.json 的 names（HR 班表出勤人头，与计划表一致）
//   在线 ← plan.json 的 names_online（2026-09-14 新增：整月班表 schedule.json 未上公网，
//          公网页面取不到，故让 plan.json 顺带带出，保证公网在线一格不空）
//   兜底 ← ../schedule.json 的 daily[date].onDuty ∩ agents(dept)（仅本地有效）
function mealRoster(dateStr, dept) {
  const d = planDay(dateStr);
  if (d) {
    const arr = dept === '400' ? d.names : d.names_online;
    if (arr && arr.length) return arr.slice();
  }
  const sc = SCHED || {};
  const day = (sc.daily || {})[dateStr];
  if (!day || !Array.isArray(day.onDuty)) return [];
  const set = new Set((sc.agents || []).filter(a => a.dept === dept).map(a => a.name));
  return day.onDuty.filter(n => set.has(n));
}
// 返回 { '400': {names, wins:{A:{...},B:{...}}}, '在线': {...} }
function mealPlanFor(dateStr) {
  const out = {};
  MEAL_DEPTS.forEach(dept => {
    const names = mealRoster(dateStr, dept);
    const wins = {};
    MEAL_WINS.forEach(w => {
      const slots = mealSlots(w);
      wins[w.key] = { name: w.name, from: hm(w.from), to: hm(w.to), slots,
                      map: mealAllocate(names, slots, mealSlotWeights(slots)) };
    });
    out[dept] = { names, wins };
  });
  return out;
}
// 某半小时的用餐人数（两餐窗口不重叠，直接相加）
function mealCountAt(mp, dept, label) {
  const g = mp && mp[dept];
  if (!g) return 0;
  let n = 0;
  MEAL_WINS.forEach(w => { const m = g.wins[w.key].map[label]; if (m) n += m.length; });
  return n;
}

// ── 预测：与 forecast/build_400_forecast.py 的 build() 完全同构 ──
// 当班人力：优先取计划表里「该日 × 当前口径」的逐半小时人数；缺失则回退运营分时段表同周几均值
function planStaff(dateStr, wd) {
  const m = PLAN && PLAN.staff_slots && PLAN.staff_slots[PLAN_MODE];
  if (m && m[dateStr]) return m[dateStr];
  return (C && C.staff_by_wd[String(wd)]) || {};
}

function predict(orders, dateStr) {
  const dt = new Date(dateStr + 'T00:00:00');
  const wd = (dt.getDay() + 6) % 7;                 // JS 周日=0 → 归一成 周一=0
  const wdName = WD[wd];
  const capHalf = CAP / 2;                                  // 半小时产能（通/人）
  const R  = C.R_base / 100 * (C.R_factor[wdName] ?? 1);   // 咨询比
  const IN = orders * R;                                    // 进线量
  const TR = IN * C.turn_rate / 100;                        // 转人工量
  const U  = Math.max(0.20, Math.min(0.75, C.U_a / 100 + C.U_b / 100 * IN));  // 人工处理率
  const H  = IN * U;                                        // 人工处理量

  const staff = planStaff(dateStr, wd);
  const mp = MEAL;
  const slots = C.shape.slots.map(t => {
    const shareT = C.shape.share_turn[t] || 0;
    const turnH  = TR * shareT;
    const need   = turnH / capHalf;
    const on     = staff[t] || 0;
    const needI  = Math.ceil(need);
    const onI    = on ? Math.floor(on + 0.999) : 0;
    // 用餐扣减：该半小时离岗吃饭的人数（400；窗口 10:30–14:00 / 17:00–20:00，每人每餐 30 分钟）
    const meal   = mp ? mealCountAt(mp, '400', t) : 0;
    const availI = Math.max(0, onI - meal);        // 实到 = 当班 − 用餐
    return {
      // ⚠️ gap / gapI 一律 = 实到 − 需求：<0 缺口（标红）、>0 冗余（标绿）
      //    （用户 2026-09-14：缺口要扣除用餐；不扣餐会低估午晚高峰的缺口）
      t, inbound: IN * (C.shape.share_in[t] || 0), turn: turnH,
      need, needI, on, onI, meal, availI, gap: availI - need, gapI: availI - needI,
      load: on ? turnH / (on * capHalf) * 100 : null,
      shareT
    };
  });

  // 第一遍（MEAL 为空）= 不含用餐的「基础盘」→ 供用餐错峰取各槽空闲度权重
  if (!MEAL) BASE_SLOTS = slots;

  const needPh = TR / CAP;
  const onPh   = Object.values(staff).reduce((a,b)=>a+b, 0) * 0.5;
  const ratio  = needPh ? onPh / needPh : null;

  // ── 人数口径（主显示）：需要几个人 / 班表安排了几个人 ──
  const pday  = planDay(dateStr);
  const avgH  = (pday && pday.avg_hours) || 11.0;         // 该日班表人均出勤时长（h/人）
  const names = (pday && pday.names) || [];
  const needHc = avgH ? Math.ceil(TR / CAP / avgH) : 0;   // 需求人数（向上取整）
  const onHc = (PLAN_MODE === 'schedule' && names.length)
    ? names.length                                        // HR 班表：实际出勤人头
    : Math.round(onPh / avgH);                            // 无名单口径：按人均时长反推
  // ⚠️ 差额 = 当班 − 需求：<0 = 缺口（标红）、>0 = 冗余（标绿）。与计划表、时段明细、图表全页同向（用户 2026-09-14 口径）
  const gapHc = onHc - needHc;

  return {wd, wdName, orders, dateStr, R, IN, TR, U, H, needPh, onPh, ratio, slots,
          avgH, names, needHc, onHc, gapHc,
          staffRef: C.staff_ref[String(wd)], staffSrc: PLAN_MODE === 'schedule' ? 'HR 班表' : '运营分时段表'};
}

// 从 plan.json 取某天的记录（可能为 null，如超出计划表范围）
function planDay(dateStr) {
  return ((PLAN && PLAN.days) || []).find(d => d.date === dateStr) || null;
}

// 半小时明细 → 小时明细（1 小时内 人时 ≡ 平均在岗人数）
// ⚠️ 用餐口径同步聚合：半小时粒度下 meal = 离岗人数；小时粒度下 meal = Σ(半小时离岗) × 0.5（人时 ≡ 该小时平均离岗人数），
//    与 on 同单位，才能做 avail = on − meal。
function aggregate(slots, grain) {
  if (grain === 'half') {
    return slots.map(s => ({label: s.t, inbound: s.inbound, turn: s.turn,
                            need: s.need, on: s.on, meal: s.meal || 0,
                            onI: s.onI, availI: s.availI != null ? s.availI : s.onI,
                            gap: s.gap, gapI: s.gapI, load: s.load, n: 1}));
  }
  const m = new Map();
  slots.forEach(s => {
    const h = s.t.slice(0, 2);
    if (!m.has(h)) m.set(h, []);
    m.get(h).push(s);
  });
  return [...m.entries()].map(([h, arr]) => {
    const inbound = arr.reduce((a,s)=>a+s.inbound, 0);
    const turn    = arr.reduce((a,s)=>a+s.turn, 0);
    const need    = arr.reduce((a,s)=>a+s.need, 0) * 0.5;   // 人时
    const on      = arr.reduce((a,s)=>a+s.on,   0) * 0.5;   // 人时（=该小时平均人数）
    const meal    = arr.reduce((a,s)=>a+(s.meal||0), 0) * 0.5;  // 人时（=该小时平均离岗人数）
    const avail   = Math.max(0, on - meal);                 // 实到人数
    const gap     = avail - need;                           // 实到 − 需求：<0 缺口、>0 冗余
    const gapI    = Math.round(avail) - Math.ceil(need);
    const load    = on ? turn / (on * CAP) * 100 : null;
    return {label: h + ':00', inbound, turn, need, on, meal, avail, gap, gapI, load, n: arr.length};
  });
}

// ─────────────────────────────────────────────────────────────
// 现场调控 · ① 预警卡（读 ../alert_state.json，等级名与主看板/飞书告警同源）
// ─────────────────────────────────────────────────────────────
function lvPill(level, tag) {
  const n = (typeof level === 'number' && level >= 0 && level <= 4) ? level : null;
  if (n === null) return '<span class="lv lv-1">' + tag + ' 无数据</span>';
  return '<span class="lv lv-' + n + '">' + tag + ' ' + (LV_NAME[n] || '?') + '</span>';
}
function actsHtml(level, dim) {
  const a = (PLAN_ACT[dim] || {})[level];
  if (!a) return '<div class="sc-acts"><span class="none">-</span></div>';
  return '<ol>' + a.map(x => '<li>' + x + '</li>').join('') + '</ol>';
}
// 单个对象卡（400 / 在线）：日 + 周两级
function scObj(title, day, week) {
  let h = '<div class="sc-obj"><div class="hd"><span class="nm">' + title + '</span>' +
          (day ? lvPill(day.level, '日') : '') + (week ? lvPill(week.level, '周') : '') + '</div>';
  if (!day && !week) {
    return h + '<div class="sc-acts"><span class="none">暂未取到预警数据（alert_state.json）</span></div></div>';
  }
  // 指标行
  const row = (tag, rec) => {
    if (!rec) return '';
    const v = rec.vals || {}, parts = [];
    if (v.load != null) parts.push('运能负荷 <b>' + v.load + '%</b>');
    if (v.rate != null) parts.push('接通率 <b>' + v.rate + '%</b>');
    if (!parts.length) return '';
    let sub = '';
    if (v.lv != null && v.rv != null) {
      // 命中预警档（≥一级）才是「取较严档」；否则两指标都没到预警线 → 正常
      sub = ' <span class="u2">（负荷档 ' + (LV_NAME[v.lv] || '?') + ' · 接通档 ' + (LV_NAME[v.rv] || '?') +
            (rec.level >= 2 ? '，取较严档' : (rec.level === 0 ? '，同落低负荷档' : '，均未达预警线')) + '）</span>';
    }
    return '<div class="sc-row"><span class="k">' + tag + '</span><span>' + parts.join(' · ') + sub + '</span></div>';
  };
  h += row('日', day) + row('周', week);
  // 预案动作（按当前等级）+ 责任人（图里「责任人」列：一~二级客服组长，三级业务负责人）
  const owner = lv => (PLAN_OWNER[lv] ? '<span class="own">责任人：' + PLAN_OWNER[lv] + '</span>' : '');
  h += '<div class="sc-acts">';
  if (day) {
    h += '<div class="ah">日维度预案 · ' + (LV_NAME[day.level] || '-') + owner(day.level) + '</div>' +
         actsHtml(day.level, 'd');
  }
  if (week) {
    h += '<div class="ah"' + (day ? ' style="margin-top:7px"' : '') + '>周维度预案（T-1）· ' +
         (LV_NAME[week.level] || '-') + owner(week.level) + '</div>' + actsHtml(week.level, 'w');
  }
  return h + '</div></div>';
}
function scHtml() {
  const ob = (ALERT && ALERT.objects) || {};
  // 本页只做 400（用户 2026-09-14：在线暂不做预测，在线预警仍看主看板）
  return scObj('📞 400 电话', ob.c400d, ob.c400w);
}

// ─────────────────────────────────────────────────────────────
// 现场调控 · ② 按时段人力调控建议（从早到晚，逐段明确「需几人 / 排几人 / 补几人」）
// ─────────────────────────────────────────────────────────────
function timelineRows(res) {
  const rows = aggregate(res.slots, GRAIN);
  return rows.map(r => {
    const needI = Math.ceil(r.need - 1e-9);       // 需求人数（向上取整）
    const onI   = Math.round(r.on);               // 当班人数
    const mealI = Math.round(r.meal || 0);        // 该时段离岗用餐人数
    const availI = Math.max(0, onI - mealI);      // 实到人数
    const d     = availI - needI;                 // >0 冗余、<0 缺口（已扣用餐）
    const dNoMeal = onI - needI;                  // 不扣餐时的差额 → 用来标出「缺口是吃出来的」
    // 时段标签：小时粒度 '08:00' → '08:00–09:00'
    let t = r.label;
    if (t.indexOf('-') > 0) t = t.replace('-', '–');
    else t = t + '–' + String(+t.slice(0, 2) + 1).padStart(2, '0') + ':00';
    // 近 7 日同段接通率（小时粒度取两个半小时的均值）
    const h2 = t.slice(0, 2);
    const keys = GRAIN === 'half' ? [r.label]
      : [h2 + ':00-' + h2 + ':30', h2 + ':30-' + String(+h2 + 1).padStart(2, '0') + ':00'];
    let rate = null;
    if (HH_RATE && HH_RATE.slots) {
      const vs = keys.map(k => HH_RATE.slots[k]).filter(v => typeof v === 'number');
      if (vs.length) rate = vs.reduce((a, b) => a + b, 0) / vs.length;
    }
    return { t, needI, onI, mealI, availI, d, dNoMeal, rate };
  });
}
function renderAdvice(res) {
  const rows = timelineRows(res);
  const over  = rows.filter(r => r.d < 0);
  const under = rows.filter(r => r.d > 0);
  // 缺口由「用餐」造成的段（不扣餐不缺、扣了才缺）—— 这类缺口优先用错峰/抽调解决，不必增编
  const byMeal = rows.filter(r => r.d < 0 && r.dNoMeal >= 0);

  let head;
  if (res.ratio === null) head = '排班基准缺失，暂无法给出人力建议。';
  else {

           (res.gapHc < 0 ? 'var(--bad)' : (res.gapHc > 0 ? 'var(--good)' : 'inherit')) + '">' +

    } else {

    const note = r.rate != null
      ? '<span class="tl-note">近 7 日同段接通率 <b style="color:' +
        (r.rate < 0.80 ? 'var(--bad)' : (r.rate < RATE_TGT ? 'var(--warn)' : 'var(--dim)')) + '">' +
        (r.rate * 100).toFixed(1) + '%</b>' +
        (r.rate < RATE_TGT ? '（低于目标 ' + ((RATE_TGT - r.rate) * 100).toFixed(1) + 'pt）' : ' ✓') + '</span>' : '';

         '<span class="tl-n">需 <b style="color:var(--txt)">' + r.needI + '</b> 人 · 当班 <b style="color:var(--txt)">' +

  });

function render(res) {
  RES = res;

  // ── KPI：① 全天预估（整体口径，单独放最前）② 与实际同窗口的 预估 vs 实际 ──
  //   用户 2026-09-14 口径：实际采到几点，预测量就截到几点（左右两端都对齐），否则看不出高估/低估。
  const act = actualLiveSum(res.dateStr);
  const live = !!(act && act.partial && act.last);                  // 当日实时（当天未完）
  const wFrom = live ? act.first : null, wTo = live ? act.last : null;
  const pCut = live ? predictTo(res, wFrom, wTo) : null;             // 预测截到同一窗口
  const pIn = pCut ? pCut.inbound : res.IN;
  const pTr = pCut ? pCut.turn : res.TR;
  const winTag = live ? (wFrom && wFrom !== wTo ? wFrom + '–' + wTo : '截至 ' + wTo) : '全天';
  const actNote = live
    ? '同源当日实时采集（' + wFrom + '–' + wTo + '，含 IVR）'
    : (act ? '历史归档（全天）' : '该日无实时数据');
  // 预测 vs 实际 偏差：正值 = 预测高于实际（高估），负值 = 预测低于实际（低估）
  const dev = (p, a) => (a != null && a > 0) ? (p / a - 1) * 100 : null;
  const devNote = v => v == null ? ''
    : '　<b style="color:' + (Math.abs(v) < 3 ? 'var(--dim)' : (v > 0 ? 'var(--warn)' : 'var(--good)')) + '">' +
      (v > 0 ? '高估' : '低估') + ' ' + Math.abs(v).toFixed(1) + '%</b>';
  $('kpis').innerHTML = [
    '<div class="kpi-sep">全天预估 · 整体口径（看总量，不参与对比）</div>',
    card('全天预估进线量', fmt(res.IN), '通', '', '模型全天口径'),
    card('全天预估人工进线量', fmt(res.TR), '通', '', '模型全天口径'),
    '<div class="kpi-sep">' + (live
      ? '当日对比 · ' + winTag + '（预估与实际同一窗口，可直接比高低）'
      : '当日对比 · 全天口径（该日无实时分时段数据）') + '</div>',
    card('预估进线量', fmt(pIn), '通', '', winTag + ' 预测' + devNote(dev(pIn, act && act.inbound))),
    card('实际进线量', act && act.inbound != null ? fmt(act.inbound) : '—', '通', 'act', actNote),
    card('预估人工进线量', fmt(pTr), '通', '', winTag + ' 预测' + devNote(dev(pTr, act && act.turn))),
    card('实际人工进线量', act ? fmt(act.turn) : '—', '通', 'act', actNote),
  ].join('');

  // ── 现场调控：预警 + 按时段建议 ──
  $('scWarn').innerHTML = scHtml();
  $('scNote').innerHTML = ALERT
    ? '本页只做 <b>400 电话</b>（在线预警仍看主看板）　·　判据时间 <b>' + (ALERT.updated || '-') +
      '</b>　·　档位与判定规则见页底「报表说明」'
    : '<span class="err">未取到预警数据（alert_state.json），请确认采集器在跑。</span>';
  renderAdvice(res);
  $('adviceNote').innerHTML =
    '口径：<b>需求 / 当班均为该时段平均在岗人数（人）</b>，需求 = 该时段转人工量 ÷ ' + CAP + ' 通/人/时 ÷ 0.5h；' +
    '<b>缺口 / 冗余 = 当班 − 需求</b>（<span style="color:var(--bad)">负数 = 缺口</span>、<span style="color:var(--good)">正数 = 冗余</span>）。' +
    '当班人力 = ' + (res.staffSrc === 'HR 班表'
      ? 'HR 班表该日出勤 <b>' + res.onHc + ' 人</b>' + (res.names.length ? '（' + res.names.join('、') + '）' : '') +
        '，共 ' + fmt(res.onPh, 1) + ' 人时，按历史同时段人数形状摊分到各半小时'
      : '运营分时段表近 4 个同周几排班均值（' + fmt(res.onPh, 1) + ' 人时 ≈ ' + res.onHc + ' 人）') + '。' +
    (HH_RATE ? '<br>「近 7 日同段接通率」= 400 半小时表内口径（<b>接通量 ÷ 转人工量</b>，人工接通率），窗口 ' +
      (HH_RATE.window.from || '-') + ' ~ ' + (HH_RATE.window.to || '-') +
      '（' + HH_RATE.window.days + ' 天均值）—— 与上方大盘「接通率」（接听 ÷ 呼入总数，含 IVR 自助接起）口径不同，仅用于定位吃力时段。' : '');

  // 页脚「模型输入」：预估订单量 / 预估咨询比（原 KPI 卡，2026-09-14 移至此处）
  const fm = $('footModel');
  if (fm) {
    const fromCargo = CARGO && CARGO.by_date && CARGO.by_date[res.dateStr] != null;
    fm.innerHTML = '预估订单量 <b>' + fmt(res.orders) + ' 单</b>（' +
      (fromCargo ? '风控货量预测自动带出，快照 ' + CARGO.snapshot_day : '手填；该日无货量预测') +
      '，页顶可手填覆盖）　·　预估咨询比 R = <b>' + (res.R * 100).toFixed(4) + '%</b>' +
      '（近 14 天中位数 × ' + res.wdName + '因子 ' + (C.R_factor[res.wdName]).toFixed(4) + '，因子取自近 42 天）';
  }

  drawChart(res.slots, res.dateStr);
  drawTable(res.slots, GRAIN);
  renderMeal(res.dateStr);
}

    '　·　<b>需求人力</b> = 转人工量 ÷ <b>' + CAP + ' 通/人/时</b> ÷ 人均出勤 <b>' + avgAll + ' h</b>（向上取整）' +
    '　·　<b>当班人力</b> = <b>' + (PLAN_MODE === 'schedule' ? 'HR 班表出勤人数' : '运营分时段表（折人数）') + '</b>' +
    '　·　' + PLAN.range.from + ' ~ ' + PLAN.range.to + ' 共 <b>' + PLAN.days.length + '</b> 天' +
    (nFc ? '（其中 ' + nFc + ' 天为货量预测）' : '') +
    '<br>点任意一行 → 下方「时段明细」切换到该日（可直接看到每小时进线量与所需人力）。';

  let h = '<thead><tr><th>日期</th><th>周几</th><th>订单量</th><th>进线量</th><th>转人工</th>' +
          '<th>需求人力</th><th>当班人力</th><th>缺口/冗余</th><th>当班/需求</th></tr></thead><tbody>';
  PLAN.days.forEach(d => {
    const avgH = d.avg_hours || 11;                       // 该日班表人均出勤时长（h/人）
    const needPh = d.turn / CAP;                          // 需求人时（随产能基准现算）
    // 当班人时按「当前口径」现算，口径切换即时生效（不用后端预计算值）
    const sl = (PLAN.staff_slots[PLAN_MODE] || {})[d.date] || {};
    const onPh = Object.values(sl).reduce((a, b) => a + b, 0) * 0.5;
    const names = d.names || [];
    const needHc = Math.ceil(needPh / avgH);              // 需要几个人（向上取整）
    const onHc = (PLAN_MODE === 'schedule' && names.length) ? names.length : Math.round(onPh / avgH);
    const gap = onHc - needHc;                            // <0 = 缺口（红）、>0 = 冗余（绿）
    const ratio = needPh ? onPh / needPh * 100 : null;
    const gc = gap < 0 ? 'gap-bad' : (gap > 0 ? 'gap-good' : '');
    const rc = ratio === null ? '' : (ratio < 98 ? 'load-hot' : '');
    const tip = (PLAN_MODE === 'schedule' && names.length)
      ? ' title="班表 ' + names.length + ' 人（人均 ' + avgH + ' h）：' + names.join('、') + '"' : '';
    h += '<tr data-d="' + d.date + '"' + tip + '><td>' + d.date.slice(5) + '</td>' +
         '<td class="' + (/六|日/.test(d.wd) ? 'wk' : '') + '">' + d.wd + '</td>' +
         '<td>' + fmt(d.orders) + '</td><td>' + fmt(d.inbound) + '</td><td>' + fmt(d.turn) + '</td>' +
         '<td>' + needHc + '</td><td>' + onHc + '</td>' +
         '<td class="' + gc + '">' + (gap > 0 ? '+' : '') + gap + '</td>' +
         '<td class="' + rc + '">' + (ratio === null ? '-' : ratio.toFixed(0) + '%') + '</td></tr>';
  });
  tb.innerHTML = h + '</tbody>';

  tb.querySelectorAll('tbody tr').forEach(tr => {
    tr.onclick = () => {
      $('dDate').value = tr.dataset.d;
      autoFillFromCargo();
      run();
    };
  });
  markPlanSel();
}

function markPlanSel() {
  const cur = $('dDate').value;
  document.querySelectorAll('#planTbl tbody tr').forEach(tr =>
    tr.classList.toggle('sel', tr.dataset.d === cur));
}

function card(k, v, u, cls, note) {
  return '<div class="kpi ' + (cls||'') + '"><div class="k">' + k + '</div>' +
         '<div class="v">' + v + (u ? '<span class="u">' + u + '</span>' : '') + '</div>' +
         (note ? '<div class="kn">' + note + '</div>' : '') + '</div>';
}

// ── 每日时段预测：折线图（预测转人工量 vs 实际转人工量）──
//   预测 = 模型链路算出的该半小时转人工量（slots[].turn）
//   实际 = 当日实时采集（呼入总数 − IVR 自助接起）或历史归档（hh_actual.json）
// ⚠️ 实际线可能只有部分时段（当日采集从早班开始、历史缺段）→ 按「连续段」断开画，不硬连线
function drawChart(slots, dateStr) {
  const W = 1040, H = 260, PL = 46, PR = 14, PT = 14, PB = 46;
  const iw = W - PL - PR, ih = H - PT - PB;
  const n = slots.length, step = iw / n;
  const px = i => PL + step * i + step / 2;

  const actMap = actualTurnMap(dateStr) || {};
  const predV = slots.map(s => s.turn);
  const actV  = slots.map(s => (typeof actMap[s.t] === 'number' ? actMap[s.t] : null));
  const nAct  = actV.filter(v => v !== null).length;

  const allV = predV.concat(actV.filter(v => v !== null));
  const maxV = Math.max(4, ...allV) * 1.12;
  const y = v => PT + ih - (v / maxV) * ih;
  let g = '';

  // 网格 + Y 轴
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const v = maxV * i / ticks, yy = y(v);
    g += '<line x1="' + PL + '" y1="' + yy + '" x2="' + (W-PR) + '" y2="' + yy + '" stroke="#253352" stroke-width="1"/>';
    g += '<text x="' + (PL-7) + '" y="' + (yy+4) + '" fill="#94a3b8" font-size="10" text-anchor="end">' + v.toFixed(0) + '</text>';
  }
  // X 轴：每 2 个标一次（整点）
  slots.forEach((s, i) => {
    if (i % 2 === 0)
      g += '<text x="' + px(i) + '" y="' + (PT+ih+16) + '" fill="#94a3b8" font-size="10" text-anchor="middle">' + s.t.slice(0,5) + '</text>';
  });
  g += '<line x1="' + PL + '" y1="' + (PT+ih) + '" x2="' + (W-PR) + '" y2="' + (PT+ih) + '" stroke="#3b4a6b" stroke-width="1"/>';

  // 折线：vals 里 null 处断开 → 每个连续段一条 path
  function linePath(vals, color, name) {
    let out = '', run = [];
    const flush = () => {
      if (run.length >= 2) {
        out += '<path d="' + run.map((p, k) => (k ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ') +
               '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
      }
      run = [];
    };
    vals.forEach((v, i) => {
      if (v === null) { flush(); return; }
      run.push({x: px(i), y: y(v), i, v});
    });
    flush();
    // 数据点 + 悬浮提示（⚠️ <title> 必须内嵌在圆点元素内部，写成兄弟节点会被当成整张 svg 的 title）
    vals.forEach((v, i) => {
      if (v === null) return;
      out += '<circle cx="' + px(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="2.6" fill="' + color + '">' +
             '<title>' + slots[i].t + '　' + name + ' ' + v.toFixed(0) + ' 通</title></circle>';
    });
    return out;
  }

  g += linePath(predV, '#60a5fa', '预测转人工量');
  if (nAct) g += linePath(actV, '#fbbf24', '实际转人工量');

  $('chart').innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' + g + '</svg>';

  // 图下口径说明
  const sum = a => a.reduce((x, y2) => x + (y2 || 0), 0);
  const predSum = sum(predV), actSum = sum(actV);
  // ⚠️ 用户 2026-09-14 口径：预测量与实际量必须**同窗口**才可比。
  //    之前拿全天预测比部分实际 → 显示「预测高于实际 61%」的假偏差；
  //    现在只统计「实际有数据」的那些时段。
  let nPair = 0, pAl = 0, aAl = 0;
  actV.forEach((v, i) => { if (v !== null) { nPair++; pAl += predV[i] || 0; aAl += v; } });
  const diff = (nPair && aAl) ? ((pAl - aAl) / aAl * 100) : null;
  let note = '<b>' + dateStr + '</b>　预测转人工量合计 <b>' + fmt(predSum) + '</b> 通（全天 ' + n + ' 段）';
  if (nAct) {
    note += '　·　实际合计 <b>' + fmt(actSum) + '</b> 通（' + nAct + '/' + n + ' 个时段有数据）';
    if (nAct < n) {
      note += '<br>同窗口对比（<b>' + nPair + '</b> 段，仅实际有数据的时段）：预测 <b>' + fmt(pAl) + '</b>' +
        ' vs 实际 <b>' + fmt(aAl) + '</b> 通' +
        (diff === null ? '' : '　·　预测' + (diff >= 0 ? '高估' : '低估') +
          ' <b style="color:' + (Math.abs(diff) < 3 ? 'var(--dim)' : (diff > 0 ? 'var(--warn)' : 'var(--good)')) + '">' +
          Math.abs(diff).toFixed(1) + '%</b>');
    } else {
      note += '　·　预测' + (diff >= 0 ? '高于' : '低于') + '实际 <b>' + Math.abs(diff).toFixed(1) + '%</b>';
    }
  } else {
    note += '　·　<span style="color:var(--warn)">该日无实际半小时数据</span>（实际数据覆盖「当日实时」与「历史归档」两类日期）';
  }
  note += '<br>口径：<b>转人工量 = 呼入总量 − IVR 自助接起</b>（两条线同源）。预测 = 进线量 × 转人工率（' + (C ? C.turn_rate : '-') + '%）；';
  if (nAct) {
    note += '实际 = ' + (HH_LIVE && HH_LIVE.date === dateStr
      ? '当日「时段量级 📞400」实时采集（四线合计，报表采集滞后约 15 分钟）'
      : '历史归档（飞书《分时段数据监控》）') + '。';
  } else {
    note += '实际线需该日半小时数据（来自「时段量级 📞400」实时采集或历史归档），当前无。';
  }
  $('chartNote').innerHTML = note;
}

function drawTable(slots, grain) {
  const rows = aggregate(slots, grain);
  $('grainNote').innerHTML = grain === 'hour'
    ? '人力 = 该小时平均在岗人数（人）'
    : '人力 = 该半小时并发在岗人数（人）';
  let h = '<thead><tr><th>时段</th><th>进线量</th><th>转人工</th><th>需求(人)</th><th>当班(人)</th>' +
          '<th>用餐(人)</th><th>缺口/冗余(人)</th><th>负荷</th></tr></thead><tbody>';
  rows.forEach(s => {
    const onI   = s.onI != null ? s.onI : Math.round(s.on);
    const mealI = Math.round(s.meal || 0);
    const availI = s.availI != null ? s.availI : Math.max(0, onI - mealI);
    const gc = s.gapI <= -1 ? 'gap-bad' : (s.gapI >= 1 ? 'gap-good' : '');
    const lc = (s.load !== null && s.load > 110) ? 'load-hot' : '';
    h += '<tr><td>' + s.label + '</td><td>' + fmt(s.inbound) + '</td><td>' + fmt(s.turn) + '</td>' +
         '<td>' + s.need.toFixed(1) + '</td><td>' + onI + '</td>' +
         '<td style="color:' + (mealI ? 'var(--warn)' : 'var(--dim)') + '">' + (mealI || '-') +
           (mealI ? '<span style="color:var(--dim);font-size:11px"> →实到' + availI + '</span>' : '') + '</td>' +
         '<td class="' + gc + '">' + (s.gap>0?'+':'') + s.gap.toFixed(1) + '</td>' +
         '<td class="' + lc + '">' + (s.load===null?'-':s.load.toFixed(0)+'%') + '</td></tr>';
  });
  $('tbl').innerHTML = h + '</tbody>';
  $('tblNote').innerHTML = '缺口/冗余 = <b>实到 − 需求</b>（实到 = 当班 − 用餐；<span style="color:var(--bad)">负 = 缺口</span> / <span style="color:var(--good)">正 = 冗余</span>）。' +
    '未在用餐窗口的时段「用餐」列为空，此时实到 = 当班。';
}

// ── 初始化 ──
async function load() {
  try {
    const r = await fetch(bust('coeffs.json'), {cache:'no-store'});
    C = await r.json();
  } catch (e) {
    $('modelSub').innerHTML = '<span class="err">系数加载失败：' + e.message + '　请先运行 <code>python forecast/export_coeffs.py</code></span>';
    return;
  }
  // 货量预测（可选）：来自《风控人效预测看板》，按日期自动带出订单量
  try {
    const rc = await fetch(bust('cargo.json'), {cache:'no-store'});
    CARGO = await rc.json();
  } catch (e) { CARGO = null; }
  // 排班计划表（build_plan.py → plan.json）：未来每日 + 逐半小时人力，含两套当班口径
  try {
    const rp = await fetch(bust('plan.json'), {cache:'no-store'});
    PLAN = await rp.json();
    if (C && C.cap_per_hour) CAP = Math.round(C.cap_per_hour * 10) / 10;   // 取 1 位，避免 5.995 这类显示
    if (C && C.rate_target) RATE_TGT = C.rate_target;
    CAP_FIXED = CAP;
    if (PLAN && PLAN.cap_per_hour && Math.abs(PLAN.cap_per_hour - CAP) > 0.05)
      console.warn('[cap] plan.json =', PLAN.cap_per_hour, 'coeffs.json =', CAP);
    $('capVal').textContent = CAP.toFixed(1) + ' 通/人/时';
    $('capNote').innerHTML = '（按人工接通率目标 <b>' + (RATE_TGT * 100).toFixed(0) + '%</b> 标定 · 表内常数 ' + SHEET_CAP + ' 仅作参照）';
  } catch (e) { PLAN = null; }
  // 实际半小时数据（「预测 vs 实际」折线图用）—— 两个都可选，缺了只画预测线
  //   ① ../call_halfhour.json —— 当日实时采集（「时段量级 📞400」同源，四线合计）
  //   ② hh_actual.json        —— 半小时实际转人工归档（forecast/build_hh_actual.js 生成，含飞书历史）
  try { const r = await fetch(bust('../call_halfhour.json'), {cache:'no-store'}); HH_LIVE = await r.json(); }
  catch (e) { HH_LIVE = null; }
  try { const r = await fetch(bust('hh_actual.json'), {cache:'no-store'}); HH_ACT = await r.json(); }
  catch (e) { HH_ACT = null; }
  // 近 7 日同时段接通率（build_hh_actual.js 顺带产出）
  try { const r = await fetch(bust('hh_rate.json'), {cache:'no-store'}); HH_RATE = await r.json(); }
  catch (e) { HH_RATE = null; }
  // 现场调控预警（alert_eval.js 每 90s 判定 → ../alert_state.json，与主看板 / 飞书告警同源）
  try { const r = await fetch(bust('../alert_state.json'), {cache:'no-store'}); ALERT = await r.json(); }
  catch (e) { ALERT = null; }
  // 飞书 HR 班表（../schedule.json）：**仅本地兜底**。在线用餐名单主来源已改为 plan.json 的
  //   names_online（整月班次矩阵未上公网 → 公网取这里 404），此文件缺失不影响公网渲染。
  try { const r = await fetch(bust('../schedule.json'), {cache:'no-store'}); SCHED = await r.json(); }
  catch (e) { SCHED = null; }
  const w = C.windows || {};
  // 只留一行关键系数；公式与口径统一放页底「报表说明」
  $('modelSub').innerHTML =
    '咨询比 <b>' + C.R_base + '%</b>　·　转人工率 <b>' + C.turn_rate + '%</b>　·　产能 <b>' + CAP +
    ' 通/人/时</b>（人工接通率目标 <b>' + (RATE_TGT * 100).toFixed(0) + '%</b>）';

  // 默认日期：**优先「今天」**；今天不在计划表范围内时取范围内最接近今天的一天。
  //   ⚠️ 原实现直接取 PLAN.range.from（计划表首日）—— 计划表若未及时刷新，页面就停在过去的
  //      日期（2026-09-16 用户反馈「每次刷新完自动停在 9/14」即此因）。改为按今天 clamp。
  const _t0 = new Date();
  const todayStr = _t0.getFullYear() + '-' + String(_t0.getMonth()+1).padStart(2,'0') + '-' + String(_t0.getDate()).padStart(2,'0');
  let d0 = todayStr;
  if (PLAN && PLAN.range && PLAN.range.from && PLAN.range.to) {
    const _f = PLAN.range.from, _to = PLAN.range.to;
    d0 = todayStr < _f ? _f : (todayStr > _to ? _to : todayStr);
  }
  $('dDate').value = d0;
  const rec = (C.recent || []).slice(-1)[0];
  if (rec && rec.orders) $('dOrders').value = rec.orders;
  autoFillFromCargo();

  // 页脚只留「元信息 + 模型输入」；模型算法与全部口径已移到页底「报表说明」
  $('foot').innerHTML =
    '系数导出时间 <b>' + C.generated_at + '</b>　·　基准日 <b>' + C.asof + '</b>　·　时段形状基于 <b>' + (C.shape.source_days || '-') + ' 天</b>实测' +
    (PLAN ? '　·　计划表 <b>' + PLAN.range.from + ' ~ ' + PLAN.range.to + '</b>（' + PLAN.days.length + ' 天，生成于 ' + PLAN.generated_at + '）' : '') +
    '<br>' +
    (CARGO ? ('货量来源：<b>' + CARGO.source + '</b>　快照日 <b>' + CARGO.snapshot_day + '</b>　换算 <b>' +
      CARGO.avg_item_weight_kg + ' kg/单</b>（' + Object.keys(CARGO.by_date || {}).length + ' 天）')
      : '<span class="err">未取到货量预测（cargo.json），订单量需手填。</span>') +
    '<br><b>模型输入（预估订单量 / 预估咨询比）</b>：<span id="footModel">-</span>';

  renderPlan();
  renderDoc();       // 页底「报表说明 · 口径与算法」
  run();
}

// 时段明细粒度切换
function setGrain(g) {
  GRAIN = g;
  $('gHour').classList.toggle('on', g === 'hour');
  $('gHalf').classList.toggle('on', g === 'half');
  if (RES) drawTable(RES.slots, GRAIN);
}
$('gHour').onclick = () => setGrain('hour');
$('gHalf').onclick = () => setGrain('half');

// 当班口径切换 → 计划表与单日详情同步重算（产能基准已固定 13，不再有切换器）
$('stfSel').onchange = () => {
  PLAN_MODE = $('stfSel').value;
  renderPlan();
  if (RES) render(predict(RES.orders, RES.dateStr));
};

// 从《风控人效预测看板》的货量预测自动带出订单量（用户仍可手改覆盖）
function autoFillFromCargo() {
  if (!CARGO || !CARGO.by_date) { $('hint').innerHTML = '未取到货量预测，请手填订单量'; return; }
  const d = $('dDate').value;
  const v = CARGO.by_date[d];
  if (!v || v.orders_forecast == null) {
    $('hint').innerHTML = '货量看板无 <b>' + d + '</b> 的预测，请手填订单量';
    return;
  }
  $('dOrders').value = v.orders_forecast;
  const kind = v.is_forecast ? '货量预测' : '实际货量';
  const cv = v.is_forecast ? v.cargo_forecast : (v.cargo_actual != null ? v.cargo_actual : v.cargo_forecast);
  $('hint').innerHTML = '📦 ' + kind + ' <b>' + fmt(cv) + '</b> kg ÷ ' + CARGO.avg_item_weight_kg +
    ' kg/单 = <b>' + fmt(v.orders_forecast) + '</b> 单' +
    '<span style="opacity:.65">（风控人效预测看板 · 快照 ' + CARGO.snapshot_day + '）</span>';
}

function run() {
  if (!C) return;
  const d = $('dDate').value, o = parseFloat($('dOrders').value);
  if (!d || !(o > 0)) { $('hint').innerHTML = '<span class="err">请填目标日期与预估订单量</span>'; return; }
  // 两遍：① 先算「不含用餐」的基础盘 → ② 按各时段空闲度错峰排餐 → ③ 再出扣餐后的正式盘
  MEAL = null; BASE_SLOTS = null;
  predict(o, d);                  // ① 基础盘（内部会写 BASE_SLOTS）
  MEAL = mealPlanFor(d);          // ② 错峰排餐（权重来自基础盘的「当班 − 需求」）
  render(predict(o, d));          // ③ 正式盘：实到 = 当班 − 用餐
  markPlanSel();
}

$('btnGo').onclick = run;
$('dOrders').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
$('dDate').addEventListener('change', () => { autoFillFromCargo(); run(); });

load();
</script>
